services:
  - type: web
    name: grid-erp
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_EMAIL
        value: marashidnk@gmail.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    # To attach a persistent disk (requires Starter plan):
    # disk:
    #   name: grid-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
