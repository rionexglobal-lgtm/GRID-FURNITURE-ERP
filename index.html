<title>GRID Shop Manager</title>

<style>:root{
  /* GRID Shop Manager: navy brand rail + warm paper surfaces, furniture-shop orange accent */

  --bg:#f3f1ec;--panel:#ffffff;--panel-2:#faf8f4;--hover:#f7f5f0;--line:#e5e0d5;--line-2:#f0ece4;--input:#d9d3c6;--tabs:#e7e2d7;

  --ok:#0e7c66;--ok-2:#0b6655;--ok-soft:#e2f3ee;--warn:#9a6411;--warn-soft:#fcf1d8;--danger:#b8352a;--danger-soft:#fbe8e6;--danger-line:#efc9c4;
  --blue:#2f5aa8;--blue-soft:#e6edf8;--violet:#6b3fb2;--violet-soft:#efe6fb;--teal:#1f6f8b;--teal-soft:#e3f1f7;
  --ink-btn:#15213b;--ink-btn-2:#24365f;--toast:#15213b;--overlay:rgba(15,22,40,.45);
  --radius:14px;--shadow:0 1px 2px rgba(21,33,59,.05),0 8px 24px rgba(21,33,59,.06);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--text)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --text:#e6e9f0;--heading:#f1f3f8;--muted:#9aa3b6;
  --accent:#ef6a43;--accent-2:#f27d5a;--accent-soft:#3a2219;--on-accent:#ffffff;
  --ok:#3fbf9b;--ok-2:#2fa585;--ok-soft:#163029;--warn:#e2ad55;--warn-soft:#352a14;--danger:#f0776b;--danger-soft:#3a1d1b;--danger-line:#5a2c28;
  --blue:#7ea4ea;--blue-soft:#1c2840;--violet:#b393ea;--violet-soft:#2a2140;--teal:#6cc0d9;--teal-soft:#16303a;
  --ink-btn:#3b5a9e;--ink-btn-2:#4a6bb2;--toast:#2a3348;--overlay:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#0d1426;--brand-2:#1b2948;--rail-text:#c3cde3;--rail-muted:#7d89a6;
  --bg:#12161f;--panel:#1a1f2b;--panel-2:#202635;--hover:#232a3a;--line:#2e3647;--line-2:#262d3c;--input:#3a4357;--tabs:#262d3c;
  --text:#e6e9f0;--heading:#f1f3f8;--muted:#9aa3b6;
  --accent:#ef6a43;--accent-2:#f27d5a;--accent-soft:#3a2219;--on-accent:#ffffff;
  --ok:#3fbf9b;--ok-2:#2fa585;--ok-soft:#163029;--warn:#e2ad55;--warn-soft:#352a14;--danger:#f0776b;--danger-soft:#3a1d1b;--danger-line:#5a2c28;
  --blue:#7ea4ea;--blue-soft:#1c2840;--violet:#b393ea;--violet-soft:#2a2140;--teal:#6cc0d9;--teal-soft:#16303a;
  --ink-btn:#3b5a9e;--ink-btn-2:#4a6bb2;--toast:#2a3348;--overlay:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text)}body{min-height:100vh;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:ui-monospace,Consolas,monospace}.muted{color:var(--muted)}.hint{color:var(--muted);font-size:12px;line-height:1.5;margin:0}
.num{text-align:right;font-variant-numeric:tabular-nums}.nowrap{white-space:nowrap}.right{text-align:right}
a{color:var(--blue)}
/* layout */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--brand);color:var(--rail-text);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;padding:14px 10px 20px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;color:#fff}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand b{font-size:15px;display:block;line-height:1.2}.brand span{font-size:11px;color:#aebbd6}
.nav{border:0;background:transparent;color:var(--rail-text);text-align:left;padding:9px 11px;border-radius:9px;cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:center;width:100%}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}.nav.active{background:#fff;color:#15213b}
.nav .ic{width:20px;text-align:center}.nav .badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px}
.nav-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--rail-muted);margin:12px 11px 4px}
/* side menu groups (accordion) and shrink-to-icons rail */
.shell{transition:grid-template-columns .2s ease}
#navList,.nav-top,.nav-grp>div{display:flex;flex-direction:column;gap:2px}
#navList,.side>.brand,.side>.me,.nav,.nav-head,.nav-g{flex-shrink:0}
.nav .ic{flex:none}
.nav .nav-lbl{flex:1;min-width:0;line-height:1.3}
.nav-g{margin-top:6px}
.nav-head{border:0;background:transparent;width:100%;display:flex;align-items:center;gap:8px;padding:8px 11px 6px;border-radius:9px;cursor:pointer;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--rail-muted);text-align:left}
.nav-head:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav-head:focus-visible,.nav:focus-visible,.rail-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav-head .ic{display:none;width:20px;text-align:center;font-size:14px;letter-spacing:0}
.nav-head .nav-lbl{flex:1}
.nav-head .badge{background:var(--accent);color:#fff;border-radius:20px;font-size:10.5px;padding:1px 7px;letter-spacing:0}
.nav-g.open .nav-head .badge{display:none}
.nav-head .chev{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s ease;margin-right:3px;flex:none}
.nav-g.open .nav-head .chev{transform:rotate(45deg)}
.nav-g.has-active .nav-head{color:#fff}
.nav-g.has-active:not(.open) .nav-head{background:rgba(255,255,255,.1)}
.nav-grp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.nav-grp>div{overflow:hidden;min-height:0}
.nav-g.open .nav-grp{grid-template-rows:1fr}
.brand-t{min-width:0;flex:1}
.rail-btn{flex:none;width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--rail-text);cursor:pointer;display:grid;place-items:center;padding:0}
.rail-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.rail-btn::before{content:"";width:7px;height:7px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateX(2px) rotate(45deg)}
.shell.rail{grid-template-columns:72px minmax(0,1fr)}
.shell.rail .side{padding-inline:8px}
.shell.rail .brand{flex-direction:column;padding-inline:0;gap:8px}
.shell.rail .rail-btn::before{transform:translateX(-2px) rotate(-135deg)}
.shell.rail .brand-t,.shell.rail .nav .nav-lbl,.shell.rail .nav-head .nav-lbl,.shell.rail .me{display:none}
.shell.rail .nav{justify-content:center;padding:9px 0;position:relative}
.shell.rail .nav .ic{font-size:17px}
.shell.rail .nav .badge{position:absolute;top:1px;right:3px;margin:0;font-size:9.5px;padding:0 5px}
.shell.rail .nav-head{justify-content:center;padding:8px 0;gap:4px;position:relative}
.shell.rail .nav-head .ic{display:inline}
.shell.rail .nav-head .chev{width:5px;height:5px;margin:0}
.shell.rail .nav-head .badge{position:absolute;top:0;right:2px;font-size:9.5px;padding:0 5px}
.shell.rail .nav-g{border-top:1px solid rgba(255,255,255,.08);padding-top:4px}
/* ---- 3D menu keys: each group has its own colour (--kf face, --kb darker same-hue base, --kg glow rgb) ---- */
.side{background:linear-gradient(180deg,#1b2a52 0%,#121d3c 45%,#0b1228 100%)}
.nav-top,.nav-grp>div{gap:6px;padding:0 4px}
.nav-top,.nav-g.open .nav-grp>div{padding-block:2px 6px}
.more-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}.more-key{font-size:12.5px;min-width:0}
.nav{--kf:#6366f1;--kb:#4338ca;--kg:99 102 241;position:relative;isolation:isolate;background:rgb(var(--kg)/.13);color:#e3e9f7;box-shadow:0 3px 0 0 rgb(var(--kg)/.38),inset 0 1px 0 rgba(255,255,255,.06);transform:translateY(0) scale(1);transition:transform 110ms cubic-bezier(.16,1,.3,1),box-shadow 110ms cubic-bezier(.16,1,.3,1),background-color 110ms;touch-action:manipulation;-webkit-tap-highlight-color:transparent;will-change:transform}
.nav .ic{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--kf);box-shadow:0 2px 0 0 var(--kb),inset 0 1px 0 rgba(255,255,255,.25);font-size:14px;line-height:1}
.nav:hover{background:rgb(var(--kg)/.22);color:#fff;transform:translateY(-1px) scale(1.02);box-shadow:0 4px 0 0 rgb(var(--kg)/.5),inset 0 1px 0 rgba(255,255,255,.08)}
.nav:active{transform:translateY(3px) scale(1);box-shadow:0 0 0 0 rgb(var(--kg)/.38);transition-duration:80ms}
.nav.active{background:var(--kf);color:#fff;box-shadow:0 3px 0 0 var(--kb),inset 0 1px 0 rgba(255,255,255,.22)}
.nav.active:hover{background:var(--kf)}
.nav.active .ic{background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.nav.active:active{box-shadow:0 0 0 0 var(--kb)}
.nav::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;opacity:0;box-shadow:0 0 0 2px rgb(var(--kg)/.55),0 0 12px 1px rgb(var(--kg)/.6)}
.nav.active::after{animation:key-pulse 2s ease-in-out infinite}
@keyframes key-pulse{0%,100%{opacity:.4}50%{opacity:.8}}
.nav.active .badge{background:#fff;color:var(--kb)}
.nav-head::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--kf,#7f8cab);box-shadow:0 2px 0 rgba(0,0,0,.25);flex:none}
.nav-head{color:#9fb0d6}
.shell.rail .nav-head::before{display:none}
.shell.rail .nav{padding:6px 0}.shell.rail .nav .ic{width:34px;height:34px;font-size:17px}
.shell.rail .nav.active .ic{background:transparent;box-shadow:none}
/* ---- white menu, black letters (same in light and dark theme) ---- */
.side{background:linear-gradient(180deg,#1a2a55 0%,#12204a 45%,#0b1530 100%);color:#e6ebf7;border-right:0}
.brand{color:#ffffff}.brand span{color:#aebbd6}
.side>.me{border-top-color:rgba(255,255,255,.12);color:#aebbd6}.side>.me b{color:#ffffff}
.rail-btn{color:#ffffff;border-color:rgba(255,255,255,.25);background:transparent}.rail-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-head{color:#dfe6f6;font-size:13px;font-weight:800;letter-spacing:.06em;padding:10px 11px 8px;gap:10px}.nav-head:hover{color:#fff;background:rgba(255,255,255,.07)}
.nav-head::before{width:10px;height:10px}.nav-g{margin-top:10px}
.nav-g.has-active .nav-head{color:#fff}.nav-g.has-active:not(.open) .nav-head{background:rgba(255,255,255,.1)}
.shell.rail .nav-g{border-top-color:rgba(255,255,255,.1)}
.nav{background:#ffffff;color:#111111;box-shadow:0 3px 0 0 var(--kb),inset 0 1px 0 #fff}
.nav:hover{background:#ffffff;color:#000;box-shadow:0 4px 0 0 var(--kb)}
.nav:active{box-shadow:0 0 0 0 var(--kb)}
.nav.active,.nav.active:hover{background:#eef1ff;background:color-mix(in srgb,var(--kf) 16%,#fff);color:#000;box-shadow:0 3px 0 0 var(--kb),0 0 0 2px var(--kf)}
.nav.active .ic{background:var(--kf);box-shadow:0 2px 0 0 var(--kb),inset 0 1px 0 rgba(255,255,255,.25)}
.nav.active .badge{background:var(--accent);color:#fff}
.shell.rail .nav.active .ic{background:var(--kf);box-shadow:0 2px 0 0 var(--kb)}
/* shop logo (Settings → Logo) */
.logo.has-img{background:#fff;padding:3px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.logo.has-img img{display:block;width:100%;height:100%;object-fit:contain}
.side .logo.has-img{width:100%;height:var(--logo-h,64px);max-width:100%;padding:6px 8px;border-radius:12px;transition:height 110ms cubic-bezier(.16,1,.3,1)}.side .logo.has-img{display:flex;align-items:center;justify-content:center}.side .logo.has-img img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}
.side .brand:has(.logo.has-img){flex-wrap:wrap;row-gap:10px}.shell:not(.rail) .side .brand:has(.logo.has-img)::after{content:"";order:2;flex-basis:100%;height:0}.side .brand:has(.logo.has-img) .brand-t{order:3;flex:1}.side .brand:has(.logo.has-img) .rail-btn{order:4}
.shell.rail .side .brand:has(.logo.has-img) .rail-btn{margin-left:0}
.shell.rail .side .logo.has-img{width:52px;height:44px;padding:3px}.shell.rail .side .logo.has-img img{max-width:46px}
.mtop .logo.has-img{width:auto!important;max-width:96px}.mtop .logo.has-img img{width:auto;max-width:90px}
.logo-set{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo-size{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;margin-top:10px;max-width:420px}.logo-size label{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:4px}.logo-size b{color:var(--heading);font-variant-numeric:tabular-nums}.logo-size input{width:100%;accent-color:var(--accent)}
.logo-prev{min-height:64px;min-width:96px;max-width:200px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.logo-prev img{max-width:176px;object-fit:contain}
.logo-prev-dark{background:linear-gradient(180deg,#1a2a55,#0b1530);border-color:transparent}
.logo-prev-dark img{background:#fff;padding:3px;border-radius:8px}
/* attachments */
.att-list{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.att{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-width:100%;min-width:0}
.att-th{width:44px;height:44px;flex:none;border:0;padding:0;border-radius:7px;overflow:hidden;background:#f1f3f8;display:grid;place-items:center;cursor:pointer}
.att-th img{width:100%;height:100%;object-fit:cover}.att-th span{font-size:11px;font-weight:800;color:#b42318;letter-spacing:.04em}
.att-m{display:flex;flex-direction:column;min-width:0}.att-n{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--heading);text-align:left;cursor:pointer;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.att-n:hover{text-decoration:underline}.att-m small{color:var(--muted);font-size:11px}
.att .att-sure{color:var(--danger);font-size:11px;font-weight:700;width:auto;padding:0 6px}
.att-clip{font-size:11px;margin-left:4px;opacity:.8}
.att-lb{position:fixed;inset:0;z-index:200;background:rgba(10,14,28,.72);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.att-lb-in{background:var(--panel);color:var(--text);border-radius:14px;max-width:min(920px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.att-lb-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}.att-lb-h b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-lb-b{padding:12px;overflow:auto;display:grid;place-items:center;min-height:120px}.att-lb-b img{max-width:100%;max-height:70vh;border-radius:8px}
.att-lb-pdf{display:grid;place-items:center;gap:6px;padding:24px 40px}.att-lb-pdf span{font-size:28px;font-weight:800;color:#b42318}.att-lb-pdf p{margin:0;color:var(--muted)}
.att-lb-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
/* snappy press for every button in the app */
.btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform 90ms cubic-bezier(.16,1,.3,1),background-color 110ms,box-shadow 110ms}
.btn:active:not(:disabled){transform:translateY(1px) scale(.97)}
.more-key{background:rgb(var(--kg)/.08);border-color:rgb(var(--kg)/.35);box-shadow:0 3px 0 0 rgb(var(--kg)/.55)}
.more-key:active{transform:translateY(3px)!important;box-shadow:0 0 0 0 rgb(var(--kg)/.55)}
.me{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12px}
.me b{color:#fff;display:block;font-size:13px}
main{padding-block:20px 50px;padding-inline:24px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:21px;margin:0;margin-right:auto;color:var(--heading);text-wrap:balance}
.mtop{display:none}
.bnav{display:none}
/* components */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.panel h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;color:var(--heading)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}.panel-h h2{margin:0}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--heading);padding:8px 13px;border-radius:9px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--hover)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn-accent:hover{background:var(--accent-2)}
.btn-ink{background:var(--ink-btn);border-color:var(--ink-btn);color:#fff}.btn-ink:hover{background:var(--ink-btn-2)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn-ok:hover{background:var(--ok-2)}
.btn-danger{color:var(--danger);border-color:var(--danger-line)}.btn-danger:hover{background:var(--danger-soft)}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:7px}.btn-lg{padding:11px 18px;font-size:15px}
.btn-ghost{border-color:transparent;background:transparent}
.icon-btn{border:0;background:transparent;width:30px;height:30px;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center;font-size:16px}.icon-btn:hover{background:var(--danger-soft);color:var(--danger)}.icon-btn.ib-n:hover{background:var(--hover);color:var(--heading)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow);min-width:0}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.kpi b{display:block;font-size:22px;margin-top:3px;color:var(--heading);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{display:block;font-size:12px;color:var(--muted);margin-top:2px}

  .modal-bg.open~#toasts{top:calc(10px + env(safe-area-inset-top));bottom:auto}
}
/* reports */
.rep-grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.rep-menu{padding:10px;position:sticky;top:12px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 40px);overflow:auto}
.rep-g{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;margin:10px 8px 4px}.rep-g:first-child{margin-top:2px}
.rep-i{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--text)}
.rep-i:hover{background:var(--hover)}.rep-i.active{background:var(--ink-btn);color:#fff}
table.rep tr.r-sec td{background:var(--panel-2);font-weight:800;color:var(--heading);text-transform:uppercase;font-size:11.5px;letter-spacing:.5px}
table.rep tr.r-sub td{font-weight:700;border-top:1px solid var(--line)}
table.rep tr.r-grp td{font-weight:700;color:var(--heading);padding-top:10px}table.rep tr.r-ind td:first-child{padding-left:26px}
table.rep tr.go{cursor:pointer}table.rep tr.go:hover td{background:var(--hover)}table.rep tr.go td.num{color:var(--blue);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
table.rep tr.r-tot td{font-weight:800;color:var(--heading);border-top:2px solid var(--line);background:var(--panel-2)}
@media(max-width:900px){.rep-grid{grid-template-columns:minmax(0,1fr)}.rep-menu{position:static;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;max-height:none}.rep-g{display:none}.rep-i{white-space:nowrap;border:1px solid var(--line)}}
/* assistant */
[hidden]{display:none!important}
.ai-log{display:flex;flex-direction:column;justify-content:flex-start;gap:10px;max-height:60vh;min-height:120px;overflow:auto;padding:4px 2px 10px}
.ai-hello{display:flex;flex-direction:column;gap:4px;padding:6px 2px}
.ai-msg{max-width:88%;padding:10px 13px;border-radius:13px;line-height:1.55;font-size:14px;overflow-wrap:anywhere}
.ai-msg.me{align-self:flex-end;background:var(--ink-btn);color:#fff;border-bottom-right-radius:4px}
.ai-msg.bot{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line-2);border-bottom-left-radius:4px}
.ai-li{display:block;padding-left:14px;position:relative}.ai-li::before{content:"•";position:absolute;left:2px;color:var(--accent)}
.ai-status{margin-top:4px;font-style:italic}
.ai-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border-top:1px solid var(--line-2);padding-top:12px}
.ai-form textarea{padding:10px 12px;border:1px solid var(--input);border-radius:10px;background:var(--panel);color:var(--text);resize:vertical;font:inherit;outline:none}
.ai-form textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.sp-bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}.sp-bulk select{width:auto;max-width:220px}.sp-t select,.sp-t input{width:100%}

/* =====================================================================
   WOOD & CREAM THEME — walnut and maple wood, cream paper, gold accents,
   serif headings. One look in light and dark (set explicitly below).
   ===================================================================== */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
  --brand:#4a2511;--brand-2:#6b3a1c;--rail-text:#f4e6d0;--rail-muted:#dcc19c;
  --bg:#f5ecdc;--panel:#fffaf1;--panel-2:#f8eedd;--hover:#f6e9d3;--line:#e5d2b4;--line-2:#efe2cb;--input:#d6bd98;--tabs:#ecdcc0;
  --text:#2c1d13;--heading:#4a2511;--muted:#7a604b;
  --accent:#8b4a24;--accent-2:#6e3618;--accent-soft:#f4e4cf;--on-accent:#fff6e8;
  --ok:#2f7a4e;--ok-2:#256641;--ok-soft:#e3f0e3;--warn:#9a610e;--warn-soft:#f8ebcf;--danger:#a8321f;--danger-soft:#f8e3dc;--danger-line:#e8c3b8;
  --blue:#2f5aa8;--blue-soft:#e6edf8;--violet:#6b3fb2;--violet-soft:#efe6fb;--teal:#1f6f78;--teal-soft:#e0f0ef;
  --ink-btn:#5b2e16;--ink-btn-2:#6e3a1d;--toast:#3d2112;--overlay:rgba(43,24,12,.5);
  --gold:#c9a24a;--gold-2:#e2c27a;
  --shadow:0 1px 2px rgba(74,37,17,.06),0 10px 26px rgba(74,37,17,.08);
  --grain:repeating-linear-gradient(97deg,rgba(255,255,255,.05) 0 2px,transparent 2px 11px),repeating-linear-gradient(93deg,rgba(0,0,0,.07) 0 1px,transparent 1px 17px),repeating-linear-gradient(101deg,rgba(0,0,0,.04) 0 3px,transparent 3px 29px);
  --walnut:var(--grain),linear-gradient(180deg,#86451f 0%,#673313 52%,#52270e 100%);
  --walnut-deep:var(--grain),linear-gradient(180deg,#5c2d14 0%,#45200c 60%,#381a09 100%);
  --maple:repeating-linear-gradient(97deg,rgba(255,255,255,.22) 0 2px,transparent 2px 12px),repeating-linear-gradient(93deg,rgba(120,70,30,.07) 0 1px,transparent 1px 15px),linear-gradient(180deg,#f6e2c1 0%,#e9c998 100%);
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  color-scheme:light}
body{background:radial-gradient(120% 80% at 70% 0%,#fbf5ea 0%,var(--bg) 55%) fixed,var(--bg)}
/* headings in serif, walnut */
.top h1{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:.01em;color:var(--heading)}
.panel h2,.modal-h,.nav-head .nav-lbl,.brand b{font-family:var(--serif)}
.panel h2{font-size:17px;font-weight:700;color:var(--heading)}
/* side panel: dark walnut wood */
.side{background:var(--walnut-deep);border-right:3px solid #2b1407;box-shadow:inset -1px 0 0 rgba(226,194,122,.25)}
.brand{color:#fff6e8}.brand b{font-size:17px;font-weight:800;letter-spacing:.02em}.brand span{color:var(--gold-2);letter-spacing:.14em;text-transform:uppercase;font-size:9.5px}
.logo{background:radial-gradient(circle at 35% 30%,#a8612f,#5b2d14);box-shadow:0 0 0 2px var(--gold),0 3px 0 #2b1407;border-radius:50%}
.logo.has-img{border-radius:12px;box-shadow:0 0 0 2px var(--gold),0 3px 0 #2b1407}
.rail-btn{color:#f4e6d0;border-color:rgba(226,194,122,.45)}.rail-btn:hover{background:rgba(226,194,122,.15)}
.side>.me{border-top-color:rgba(226,194,122,.25);color:var(--rail-muted)}.side>.me b{color:#fff6e8}
.nav-head{color:var(--gold-2);font-size:13.5px;letter-spacing:.05em}.nav-head .nav-lbl{text-transform:none;font-weight:700;font-size:15px;letter-spacing:.02em}
.nav-head:hover,.nav-g.has-active .nav-head{color:#fff1d6;background:rgba(226,194,122,.1)}
.nav-head::before{box-shadow:0 0 0 2px rgba(226,194,122,.35)}
/* menu keys: maple wood with a darker wood base */
.nav,.nav:hover{background:var(--maple);color:#3a1f0e;box-shadow:0 3px 0 0 #9c6a3a,0 4px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.55)}
.nav:hover{filter:brightness(1.04)}
.nav:active{box-shadow:0 0 0 0 #9c6a3a,inset 0 1px 0 rgba(255,255,255,.4)}
.nav .ic{border-radius:50%;background:radial-gradient(circle at 35% 30%,#9c5629,#5b2d14);box-shadow:0 0 0 1.5px var(--gold),0 2px 0 #3a1c0a;font-size:13px}
.nav.active,.nav.active:hover{background:var(--walnut);color:#fff6e8;box-shadow:0 3px 0 0 #2b1407,0 0 0 2px var(--gold),inset 0 1px 0 rgba(255,255,255,.18)}
.nav.active .ic{background:radial-gradient(circle at 35% 30%,#f1d58f,#b8892e);box-shadow:0 0 0 1.5px #fff1d6}
.nav::after{box-shadow:0 0 0 2px rgba(226,194,122,.6),0 0 14px 2px rgba(226,194,122,.55)}
.nav .badge,.nav.active .badge{background:#b33a1a;color:#fff}
.shell.rail .nav.active .ic{background:radial-gradient(circle at 35% 30%,#f1d58f,#b8892e)}
/* buttons: cream maple keys; primary actions are walnut pills */
.btn{background:linear-gradient(180deg,#fffaf1,#f3e3c9);border:1px solid #d9bf98;color:#4a2511;border-radius:10px;box-shadow:0 2px 0 0 #c9a77a}
.btn:hover{background:linear-gradient(180deg,#fffdf7,#f6e8d1)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 0 0 0 #c9a77a}
.btn-accent,.btn-ink{background:var(--walnut);border-color:#3e1d0b;color:#fff6e8;border-radius:999px;box-shadow:0 3px 0 0 #2b1407,inset 0 1px 0 rgba(255,255,255,.18);padding-inline:16px}
.btn-accent:hover,.btn-ink:hover{background:var(--walnut);filter:brightness(1.08)}
.btn-accent:active:not(:disabled),.btn-ink:active:not(:disabled){box-shadow:0 0 0 0 #2b1407}
.btn-ok{background:var(--grain),linear-gradient(180deg,#3d8b5c,#2a6b44);border-color:#1f5233;color:#fff;border-radius:999px;box-shadow:0 3px 0 0 #17402a,inset 0 1px 0 rgba(255,255,255,.2);padding-inline:16px}
.btn-ok:hover{background:var(--grain),linear-gradient(180deg,#46966a,#2f7a4e)}
.btn-danger{background:linear-gradient(180deg,#fffaf1,#f7e3da);color:var(--danger);border-color:var(--danger-line);box-shadow:0 2px 0 0 #e0b2a6}
.btn-ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn-sm{border-radius:8px}
.btn-sm.btn-accent,.btn-sm.btn-ink,.btn-sm.btn-ok{padding-inline:12px}
/* cards and panels: cream paper on a soft walnut edge */
.panel,.kpi{background:linear-gradient(180deg,#fffcf6,#fff7ea);border:1px solid #e3cfae;box-shadow:0 2px 0 rgba(156,106,58,.15),var(--shadow)}
.kpi span{color:#8a6a4f}.kpi b{color:var(--heading);font-family:var(--serif)}
.list-item{background:#fffcf6;border-color:#ecdcc2}
/* tabs and chips: maple track, walnut pill */
.tabs{background:var(--maple);box-shadow:inset 0 1px 3px rgba(90,50,20,.25);padding:5px}
.tabs button{color:#5b3a22}
.tabs button.active{background:var(--walnut);color:#fff6e8;box-shadow:0 2px 0 #2b1407}
.chip{background:#fffaf1;border-color:#dcc4a0;color:#4a2511}
.chip.active{background:var(--walnut);border-color:#3e1d0b;color:#fff6e8}.chip.active small{color:#f1d9b0}
/* tables */
.tw{background:#fffcf6;border-color:#e3cfae}
th{background:linear-gradient(180deg,#f6e6cb,#efdab7);color:#5b3a22;border-bottom-color:#dcc29c}
tfoot td{background:#f8ecd8}
tr.click:hover td{background:#f8ecd6}
/* form fields: carved cream inlays */
.inp,.field input,.field select,.field textarea,.search input{background:#fffdf8;border-color:#d6bd98;box-shadow:inset 0 1px 2px rgba(90,50,20,.12)}
.search input:focus,.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:inset 0 1px 2px rgba(90,50,20,.12),0 0 0 3px rgba(201,162,74,.28)}
.field label{color:#6b4a30}
.check input{accent-color:#8b4a24}
/* dialogs: cream card with a walnut header band */
.modal{background:#fffaf1;border:1px solid #d9bf98;overflow:hidden}
.modal-h{background:var(--walnut);color:#fff6e8;padding:14px 20px;font-weight:700;letter-spacing:.01em}
.modal-h .x,.modal-h button{color:#fff6e8}
.modal-b{padding-top:14px}
.modal-f{background:#f8eedd;border-top-color:#e6d2b2}
.toast{background:var(--walnut-deep);border-left-color:var(--gold)}
/* phones: walnut top bar and bottom bar */
@media(max-width:860px){
  .mtop{background:var(--walnut-deep);color:#fff6e8;border-bottom:2px solid #2b1407}
  .mtop b{font-family:var(--serif)}.mtop .btn{background:transparent;color:#fff6e8;border-color:rgba(226,194,122,.5);box-shadow:none}
  .bnav{background:var(--walnut-deep);border-top:2px solid #2b1407}
  .bnav button{color:#f4e6d0}
  .bnav button.active{background:var(--maple);color:#3a1f0e;box-shadow:0 3px 0 0 #9c6a3a,0 0 0 2px var(--gold)}
  .top h1{font-size:21px}
}
.more-key{background:var(--maple);border-color:#d0ab79;color:#3a1f0e;box-shadow:0 3px 0 0 #9c6a3a}
.logo-prev-dark{background:var(--walnut-deep)}
.sum-h{font-family:var(--serif,Georgia,serif);font-size:16px;color:var(--heading);margin:18px 0 8px}.sum .sum-h:first-child{margin-top:4px}.sum .kpi small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
</style>
<div id="app"><div class="loading">Loading the shop…</div></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-h"><span id="modalTitle"></span><button class="icon-btn x" id="modalX" aria-label="Close">✕</button></div><div class="modal-b" id="modalBody"></div><div class="modal-f" id="modalFoot"></div></div></div>
<div id="toasts"></div>
